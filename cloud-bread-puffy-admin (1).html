<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Cloud Bread Puffy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ac:#D63D77;--line:#E58FB0;--cream:#FFF1DE;--milk:#FFFAF3;--brown:#2B1710;--soft:#6B4A3A;--bg:#F7E4EA;--ok:#14663D;--bad:#A12B54;--sh:0 6px 20px rgba(107,74,58,.10)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--brown);font:16px/1.5 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;line-height:1.15;margin:0 0 .6rem}
h1{font-size:1.9rem}h2{font-size:1.3rem}h3{font-size:1.05rem}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--brown);color:var(--cream);padding:1.2rem .9rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:.3rem}
.brand{display:flex;align-items:center;gap:.55rem;font-family:Fredoka;font-size:1.1rem;padding:0 .4rem 1rem}.brand small{display:block;font:600 .8rem Nunito;color:#E9B9CB}
.side a{display:flex;justify-content:space-between;align-items:center;padding:.6rem .8rem;border-radius:12px;color:var(--cream);text-decoration:none;font-weight:700}
.side a:hover{background:rgba(255,255,255,.08)}.side a.on{background:var(--ac);color:#fff}
.side .bd{background:#fff;color:var(--ac);border-radius:99px;padding:0 .5rem;font-size:.8rem;font-weight:800}
.side .out{margin-top:auto;background:none;border:2px solid rgba(255,255,255,.25);color:var(--cream);border-radius:12px;padding:.5rem;cursor:pointer;font-weight:700}
main{padding:1.6rem 2rem 3rem;max-width:1100px;width:100%}
.sub{color:var(--soft);margin:0 0 1.2rem}
.btn{display:inline-block;border:0;border-radius:99px;padding:.5rem 1.05rem;background:var(--brown);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;font-size:.92rem}
.btn.pink{background:var(--ac)}.btn.ghost{background:#fff;color:var(--brown);border:2px solid var(--line)}.btn.bad{background:#fff;color:var(--bad);border:2px solid var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--milk);border-radius:20px;box-shadow:var(--sh);padding:1.2rem;margin-bottom:1rem}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.9rem;margin-bottom:1rem}
.stat div{background:var(--milk);border-radius:18px;padding:1rem 1.1rem;box-shadow:var(--sh)}.stat b{display:block;font:600 1.7rem Fredoka}.stat span{color:var(--soft);font-size:.9rem}
.queue{background:var(--ac);color:#fff;border-radius:24px;padding:1.3rem;margin-bottom:1rem}
.queue h2{font-size:1.6rem}.queue .qi{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;background:rgba(255,255,255,.16);border-radius:14px;padding:.6rem .9rem;margin-top:.5rem}
.queue .btn{background:#fff;color:var(--brown)}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:1rem}
.chart{display:flex;align-items:flex-end;gap:.6rem;height:170px;padding-top:.5rem}.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.78rem;text-align:center}
.chart i{display:block;width:100%;background:var(--line);border-radius:8px 8px 0 0;min-height:3px}.chart small{color:var(--soft)}
.li{display:flex;justify-content:space-between;gap:1rem;padding:.4rem 0;border-bottom:1px dashed var(--line)}.li:last-child{border:0}
.tag{display:inline-block;border-radius:99px;padding:.1rem .7rem;font-size:.8rem;font-weight:800;background:#EEE;color:#333}
.t-w{background:#FFE9B5;color:#6B4400}.t-v{background:#E6D9FF;color:#3F1C8F}.t-p{background:#D3E8FF;color:#0B4A8C}.t-s{background:#CDEFD9;color:var(--ok)}.t-x{background:#FAD3DF;color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:.6rem 0}.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:.25rem .85rem;font-weight:700;cursor:pointer}.chip.on{background:var(--brown);color:#fff;border-color:var(--brown)}
input[type=text],input[type=search],input[type=number],input[type=password],select{padding:.5rem .8rem;border:2px solid var(--line);border-radius:12px;background:#fff;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}.bar input[type=search]{flex:1;min-width:200px}
.ord{border-left:6px solid var(--line)}.ord header{display:flex;flex-wrap:wrap;gap:.4rem .9rem;align-items:center;justify-content:space-between;margin-bottom:.4rem}
.ord p{margin:.2rem 0;color:var(--soft)}.acts{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.7rem}
.prow{display:grid;grid-template-columns:52px 1.6fr 130px 150px 90px;gap:.8rem;align-items:center;padding:.6rem 0;border-bottom:1px dashed var(--line)}
.th{width:52px;height:52px;border-radius:14px;background-size:cover;background-position:center;position:relative;overflow:hidden;border:2px solid #fff;box-shadow:var(--sh)}.th img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.stp{display:inline-flex;align-items:center;gap:.2rem}.stp button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;font-weight:800}.stp input{width:62px;text-align:center}
.low{color:var(--bad);font-weight:800}
.note{background:var(--cream);border-radius:14px;padding:.7rem 1rem;font-size:.9rem;margin:.6rem 0 1rem}
.empty{text-align:center;color:var(--soft);padding:2rem 1rem}
.f label{display:block;font-weight:700;margin:.7rem 0 .2rem}.f input{width:100%;max-width:340px}
#login{min-height:100vh;display:grid;place-items:center;padding:1rem}#login .panel{max-width:380px;width:100%;text-align:center}
#login input{width:100%;text-align:center;font-size:1.4rem;letter-spacing:.4rem;margin:.8rem 0}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
dialog{border:0;border-radius:18px;padding:0;max-width:440px;width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(43,23,16,.5)}
.rc{padding:1.4rem;font-size:.92rem;background:#fff}.rc .c{text-align:center}.rc hr{border:0;border-top:2px dashed var(--soft);margin:.7rem 0}.rc .r{display:flex;justify-content:space-between;gap:1rem}.rc .r span:last-child{text-align:right}.rc .tot{font-weight:800;font-size:1.05rem}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--brown);color:#fff;padding:.65rem 1.2rem;border-radius:99px;transition:transform .3s;z-index:50;max-width:90vw}#toast.show{transform:translate(-50%,0)}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:.7rem}.brand{padding:0 .5rem 0 0;width:100%}.side .out{margin:0}main{padding:1.1rem 1rem 3rem}.two{grid-template-columns:1fr}.prow{grid-template-columns:52px 1fr;}.prow>*:nth-child(n+3){grid-column:2}}
@media print{.app,#login,#toast,#notifs,.noprint{display:none!important}body{background:#fff}dialog{position:static;box-shadow:none;max-width:none;width:auto}dialog::backdrop{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

#notifs{position:fixed;top:16px;right:16px;display:grid;gap:.5rem;z-index:60;width:min(380px,calc(100vw - 32px))}
.nt{background:#fff;border-left:6px solid var(--ac);border-radius:14px;box-shadow:0 10px 30px rgba(43,23,16,.28);padding:.7rem .9rem;cursor:pointer;animation:ntin .3s}
.nt b{display:block}.nt small{color:var(--soft)}
@keyframes ntin{from{transform:translateX(30px);opacity:0}}
</style>
</head>
<body>
<div id="root"></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="notifs" aria-live="polite"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = { apiKey: "AIzaSyBjnfa-C5CtM9kXuB5z9BLXRRq3Ss2kfi8", authDomain: "cloud-bread-puffy.firebaseapp.com", projectId: "cloud-bread-puffy", storageBucket: "cloud-bread-puffy.firebasestorage.app", messagingSenderId: "914380160588", appId: "1:914380160588:web:d7de33e06b0eb9b310bee9", measurementId: "G-MQHG4NCX4B" };
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
const fbDb = firebase.firestore();
</script>
<script>
/* ===== Admin Cloud Bread Puffy =====
   Memakai kunci localStorage yang sama dengan halaman pelanggan (awalan cbp_),
   jadi kedua file harus dibuka dari alamat/origin yang sama (mis. Live Server). */
let adminUser = null, adminCloudReady = false, adminOrdersUnsub = null;
const PREF = "cbp_", NEED = ["Menunggu Verifikasi", "Menunggu Konfirmasi"], PROC = ["Diproses", "Siap Diambil", "Dalam Pengiriman"];
const STATUSES = ["Menunggu Pembayaran","Menunggu Verifikasi","Menunggu Konfirmasi","Diproses","Siap Diambil","Dalam Pengiriman","Selesai","Dibatalkan"];
const STORE = { name: "Cloud Bread Puffy", address: "Jl. Kesawan, Medan, Sumatera Utara, Indonesia", wa: "0881027915414" };
const COLORS = { Purple:"#8A4DFF", Pink:"#FF3D8B", Blue:"#2E96FF", Yellow:"#FFB800", Green:"#1FBF6B", Rainbow:"linear-gradient(135deg,#FF3D8B,#FFB800,#1FBF6B,#2E96FF,#8A4DFF)" };
const IMG = (c, k) => "https://rahmayantisyahna-cell.github.io/bread/" + c.toLowerCase() + "-" + k.toLowerCase() + ".jfif";
const PRODUCTS = Object.keys(COLORS).flatMap((k, i) => [
  { id: "o" + (i+1), name: `Original ${k} Cloud Bread`, cat: "Original", color: k, price: k==="Rainbow"?20000:18000, stock: 20, img: IMG("original", k) },
  { id: "t" + (i+1), name: `${k} Topping Cloud Bread`, cat: "Topping", color: k, price: k==="Rainbow"?30000:27000, stock: 15, img: IMG("topping", k) }
]).sort((a, b) => a.cat === b.cat ? 0 : a.cat === "Original" ? -1 : 1);

const $ = (s, r = document) => r.querySelector(s);
const rp = n => "Rp" + Number(n || 0).toLocaleString("id-ID");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(PREF + k)); return v ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(PREF + k, JSON.stringify(v)); } catch { toast("Penyimpanan browser penuh atau diblokir."); }
  if (k === "orders" && Array.isArray(v) && adminCloudReady) syncAdminOrders(v);
  if (k === "stock" && adminCloudReady) fbDb.collection("appData").doc("stock").set({values:v, updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(e=>toast("Gagal menyimpan stok ke Firebase: "+e.code));
};
async function syncAdminOrders(list) {
  try { const batch = fbDb.batch(); list.forEach(o => { const ref=fbDb.collection("orders").doc(String(o.id)); batch.set(ref,{...o, updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}); }); await batch.commit(); }
  catch(e) { console.error(e); toast("Gagal menyimpan pesanan ke Firebase: "+(e.code||e.message)); }
}
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600); };
const fdate = d => new Date(d).toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" });
const getOrders = () => { const o = load("orders", []); return Array.isArray(o) ? o : []; };
const getOv = () => { const o = load("overrides", {}); return o && typeof o === "object" && !Array.isArray(o) ? o : {}; };
const getStock = () => { let s = load("stock", {}); if (!s || typeof s !== "object") s = {}; PRODUCTS.forEach(p => { if (typeof s[p.id] !== "number") s[p.id] = p.stock; }); return s; };
const price = p => typeof getOv()[p.id]?.price === "number" ? getOv()[p.id].price : p.price;
const tone = s => ({ "Menunggu Pembayaran":"t-w", "Menunggu Verifikasi":"t-v", "Menunggu Konfirmasi":"t-v", "Diproses":"t-p", "Siap Diambil":"t-p", "Dalam Pengiriman":"t-p", "Selesai":"t-s", "Dibatalkan":"t-x" }[s] || "");
const nextOf = o => ({ "Menunggu Verifikasi":"Diproses", "Menunggu Konfirmasi":"Diproses", "Diproses": o.del === "pickup" ? "Siap Diambil" : "Dalam Pengiriman", "Siap Diambil":"Selesai", "Dalam Pengiriman":"Selesai" }[o.status] || null);
const LOGO = `<svg viewBox="0 0 64 44" width="42" height="30" aria-hidden="true"><path d="M12 40c-8 0-11-12-3-15-2-9 9-14 15-8 4-8 17-7 19 3 9-1 13 10 6 14-2 3-5 6-9 6z" fill="#fff" stroke="#2B1710" stroke-width="2.5" stroke-linejoin="round"/><circle cx="24" cy="26" r="2" fill="#2B1710"/><circle cx="40" cy="26" r="2" fill="#2B1710"/><path d="M28 31q4 3 8 0" stroke="#2B1710" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="19" cy="30" rx="3" ry="2" fill="#FF3D8B"/><ellipse cx="45" cy="30" rx="3" ry="2" fill="#FF3D8B"/></svg>`;
function dl(name, text, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }

/* ---- Login (PIN di browser, bukan keamanan sungguhan) ---- */
const authed = () => !!adminUser && adminCloudReady;
function login() {
  adminCloudReady = false;
  const current = fbAuth.currentUser;
  if (current && !current.isAnonymous) fbAuth.signOut().catch(()=>{});
  $("#root").innerHTML = `<div id="login"><form class="panel" id="lf"><div>${LOGO}</div><h1>Admin toko</h1><p class="sub">Masuk dengan akun Firebase Authentication admin.</p>
  <input type="email" id="adminEmail" autocomplete="username" placeholder="Email admin" aria-label="Email admin" required style="letter-spacing:normal;font-size:1rem"><input type="password" id="adminPassword" autocomplete="current-password" placeholder="Kata sandi" aria-label="Kata sandi admin" required style="letter-spacing:normal;font-size:1rem"><div class="err" id="le"></div>
  <button class="btn pink" style="width:100%">Masuk</button></form></div>`;
  $("#lf").onsubmit = async e => { e.preventDefault(); const btn=$("#lf button"); btn.disabled=true; $("#le").textContent="Memeriksa akun…";
    try { const cred=await fbAuth.signInWithEmailAndPassword($("#adminEmail").value.trim(),$("#adminPassword").value); const role=await fbDb.collection("admins").doc(cred.user.uid).get();
      if (!role.exists || role.data().role !== "admin") { await fbAuth.signOut(); throw new Error("Akun ini belum diberi akses admin. Tambahkan dokumen admins dengan UID akun dan field role=admin."); }
      adminUser=cred.user; adminCloudReady=true; startAdminCloud(); route();
    } catch(err) { $("#le").textContent = err.code ? `Gagal masuk: ${err.code}` : err.message; btn.disabled=false; }
  };
}

/* ---- Notifikasi admin ---- */
const CASH = "Tunai (Cash)";
let aSeen = null;
function beep() {
  try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(.15, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .35); o.start(); o.stop(a.currentTime + .35); } catch (_) {}
}
function showBanner(title, body) {
  const d = document.createElement("div"); d.className = "nt"; d.setAttribute("role", "alert");
  d.innerHTML = `<b>${esc(title)}</b><small>${esc(body)}</small>`;
  d.onclick = () => { d.remove(); oFilter = "all"; if (location.hash === "#/orders") route(); else location.hash = "#/orders"; };
  const box = $("#notifs"); box.prepend(d); while (box.children.length > 4) box.lastChild.remove();
  setTimeout(() => d.remove(), 12000);
}
function notifyAdmin(title, body) {
  showBanner(title, body); beep(); try { navigator.vibrate?.(150); } catch (_) {}
  if (document.hidden) {
    if ("Notification" in window && Notification.permission === "granted") { try { new Notification(title, { body, tag: "cbp-admin" }); } catch (_) {} }
    if (!document.title.startsWith("🔔")) document.title = "🔔 " + document.title;
  }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) document.title = document.title.replace(/^🔔 /, ""); });
async function askNotif() {
  beep();
  if (!("Notification" in window)) return toast("Browser ini tidak mendukung notifikasi sistem. Banner dan suara tetap aktif.");
  if (Notification.permission === "denied") return toast("Notifikasi diblokir. Izinkan lewat pengaturan situs di browser.");
  const r = await Notification.requestPermission(); toast(r === "granted" ? "Notifikasi aktif ✓" : "Notifikasi tidak diizinkan"); route();
}
function watchOrders(snap) {
  const first = localStorage.getItem(PREF + "aSeen") === null;
  if (aSeen === null) { try { aSeen = JSON.parse(localStorage.getItem(PREF + "aSeen")) || {}; } catch { aSeen = {}; } }
  const fresh = [];
  snap.docs.forEach(d => {
    const o = d.data(), prev = aSeen[d.id];
    if (!d.metadata.hasPendingWrites) {
      if (prev === undefined && !first) fresh.push(o);
      else if (prev !== undefined && prev !== o.status && NEED.includes(o.status)) notifyAdmin("Pembayaran perlu diverifikasi 💳", `${o.id} – ${o.name} menandai sudah membayar ${rp(o.total)}.`);
    }
    aSeen[d.id] = o.status;
  });
  try { localStorage.setItem(PREF + "aSeen", JSON.stringify(aSeen)); } catch (_) {}
  if (fresh.length > 3) notifyAdmin(`${fresh.length} pesanan baru masuk 🧁`, "Buka menu Pesanan untuk melihat dan mengonfirmasi.");
  else fresh.forEach(o => notifyAdmin(o.pay === CASH ? "Pesanan baru (bayar tunai) 💵" : "Pesanan baru masuk 🧁", `${o.id} – ${o.name}, ${rp(o.total)}` + (o.pay === CASH ? ". Perlu dikonfirmasi." : ` (${o.pay}).`)));
}

/* ---- Kerangka & router ---- */
const NAV = [["dashboard","Ringkasan"],["orders","Pesanan"],["products","Produk & stok"],["reviews","Ulasan"],["settings","Pengaturan"]];
const views = { dashboard, orders: ordersView, products: productsView, reviews: reviewsView, settings: settingsView };
function route() {
  if (!authed()) return login();
  let n = location.hash.replace(/^#\/?/, "") || "dashboard"; if (!views[n]) n = "dashboard";
  const need = getOrders().filter(o => NEED.includes(o.status)).length;
  $("#root").innerHTML = `<div class="app"><nav class="side" aria-label="Menu admin"><div class="brand">${LOGO}<div>Cloud Bread Puffy<small>Panel admin</small></div></div>
  ${NAV.map(([k, l]) => `<a href="#/${k}" class="${k === n ? "on" : ""}">${l}${k === "orders" && need ? `<span class="bd">${need}</span>` : ""}</a>`).join("")}
  <button class="out" id="notifBtn" style="margin-bottom:.4rem">${"Notification" in window && Notification.permission === "granted" ? "🔔 Notifikasi aktif" : "🔔 Aktifkan notifikasi"}</button><button class="out" id="logout" style="margin-top:0">Keluar</button></nav><main id="v"></main></div>`;
  $("#notifBtn").onclick = askNotif;
  $("#logout").onclick = async () => { if (adminOrdersUnsub) adminOrdersUnsub(); adminOrdersUnsub=null; adminCloudReady=false; adminUser=null; await fbAuth.signOut(); route(); };
  views[n]();
}

/* ---- Status pesanan (stok dikembalikan saat dibatalkan) ---- */
function setStatus(id, s) {
  const orders = getOrders(), o = orders.find(x => x.id === id); if (!o || o.status === s) return;
  const st = getStock(), was = o.status === "Dibatalkan", now = s === "Dibatalkan";
  if (!was && now) o.items.forEach(i => st[i.id] = (st[i.id] || 0) + i.qty);
  if (was && !now) {
    const short = o.items.find(i => (st[i.id] || 0) < i.qty);
    if (short && !confirm(`Stok ${short.name} tidak cukup. Tetap aktifkan pesanan ini?`)) return route();
    o.items.forEach(i => st[i.id] = Math.max(0, (st[i.id] || 0) - i.qty));
  }
  o.status = s; save("orders", orders); save("stock", st); toast(`${o.id}: ${s}` + (!was && now ? " (stok dikembalikan)" : "")); route();
}
const stMsg = { "Diproses":"sedang kami siapkan", "Siap Diambil":"sudah siap diambil di toko", "Dalam Pengiriman":"sedang dalam pengiriman", "Selesai":"sudah selesai. Terima kasih sudah berbelanja!", "Dibatalkan":"kami batalkan", "Menunggu Pembayaran":"menunggu pembayaran dari Anda" };
function waCust(o) {
  let p = String(o.phone || "").replace(/\D/g, ""); if (p.startsWith("0")) p = "62" + p.slice(1);
  const m = `Halo ${o.name}, pesanan ${o.id} di ${STORE.name} ${stMsg[o.status] || "berstatus " + o.status}.`;
  return `https://wa.me/${p}?text=${encodeURIComponent(m)}`;
}

/* ---- Ringkasan ---- */
function dashboard() {
  const os = getOrders(), st = getStock(), live = os.filter(o => o.status !== "Dibatalkan");
  const need = os.filter(o => NEED.includes(o.status)), proc = os.filter(o => PROC.includes(o.status));
  const omzet = os.filter(o => o.status === "Selesai").reduce((t, o) => t + o.total, 0);
  const today = os.filter(o => new Date(o.date).toDateString() === new Date().toDateString()).length;
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); return { l: d.toLocaleDateString("id-ID", { weekday: "short" }), v: live.filter(o => new Date(o.date).toDateString() === d.toDateString()).reduce((t, o) => t + o.total, 0) }; });
  const mx = Math.max(...days.map(d => d.v), 1);
  const sold = {}; live.forEach(o => o.items.forEach(i => sold[i.name] = (sold[i.name] || 0) + i.qty));
  const best = Object.entries(sold).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const low = PRODUCTS.filter(p => st[p.id] <= 5).sort((a, b) => st[a.id] - st[b.id]);
  $("#v").innerHTML = `<h1>Ringkasan</h1><p class="sub">Kondisi toko dari data pesanan di browser ini.</p>
  <section class="queue"><h2>${need.length ? `${need.length} pesanan menunggu Anda` : "Tidak ada pesanan yang menunggu"}</h2>
  ${need.length ? need.slice(0, 5).map(o => `<div class="qi"><span><b>${esc(o.id)}</b> – ${esc(o.name)}, ${rp(o.total)} (${esc(o.pay)})</span><button class="btn" data-go="${esc(o.id)}">Verifikasi & proses</button></div>`).join("") + (need.length > 5 ? `<p style="margin:.6rem 0 0"><a href="#/orders" style="color:#fff">Lihat semua pesanan</a></p>` : "") : `<p style="margin:0">Pesanan yang sudah dibayar pelanggan akan muncul di sini.</p>`}</section>
  <div class="stat"><div><b>${today}</b><span>Pesanan hari ini</span></div><div><b>${proc.length}</b><span>Sedang diproses</span></div><div><b>${rp(omzet)}</b><span>Omzet pesanan selesai</span></div><div><b>${low.length}</b><span>Produk stok menipis (5 atau kurang)</span></div></div>
  <div class="two"><div class="panel"><h2>Nilai pesanan 7 hari terakhir</h2><div class="chart">${days.map(d => `<div title="${rp(d.v)}"><small>${d.v ? rp(d.v).replace(/\.000$/, "rb") : ""}</small><i style="height:${Math.round(d.v / mx * 120)}px"></i><small>${d.l}</small></div>`).join("")}</div><small style="color:var(--soft)">Tidak termasuk pesanan yang dibatalkan.</small></div>
  <div><div class="panel"><h2>Paling laris</h2>${best.length ? best.map(([n, q]) => `<div class="li"><span>${esc(n)}</span><b>${q}</b></div>`).join("") : `<div class="empty">Belum ada penjualan.</div>`}</div>
  <div class="panel"><h2>Stok menipis</h2>${low.length ? low.map(p => `<div class="li"><span>${esc(p.name)}</span><b class="low">${st[p.id] <= 0 ? "Habis" : st[p.id]}</b></div>`).join("") + `<p style="margin:.6rem 0 0"><a href="#/products">Atur stok</a></p>` : `<div class="empty">Semua stok aman.</div>`}</div></div></div>`;
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => setStatus(b.dataset.go, "Diproses"));
}

/* ---- Pesanan ---- */
let oFilter = "all", oQ = "";
function ordersView() {
  $("#v").innerHTML = `<h1>Pesanan</h1><p class="sub">Ubah status, hubungi pelanggan lewat WhatsApp, atau cetak struk.</p>
  <div class="bar"><input type="search" id="oq" placeholder="Cari nomor, nama, atau WhatsApp" aria-label="Cari pesanan" value="${esc(oQ)}"><button class="btn ghost" id="csv">Unduh CSV</button></div><div class="chips" id="chips"></div><div id="ol"></div>`;
  $("#oq").oninput = e => { oQ = e.target.value; drawOrders(); };
  $("#csv").onclick = () => {
    const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`, rows = [["No","Tanggal","Nama","WhatsApp","Pesanan","Total","Bayar","Pengambilan","Status"]];
    getOrders().forEach(o => rows.push([o.id, new Date(o.date).toISOString(), o.name, o.phone, o.items.map(i => `${i.name} x${i.qty}`).join("; "), o.total, o.pay, o.del === "pickup" ? "Pickup" : `${o.courier} ${o.service || ""}`, o.status]));
    dl("pesanan-cloud-bread-puffy.csv", "\uFEFF" + rows.map(r => r.map(q).join(",")).join("\n"), "text/csv"); };
  drawOrders();
}
function drawOrders() {
  const all = getOrders(), q = oQ.trim().toLowerCase();
  const list = all.filter(o => (oFilter === "all" || o.status === oFilter) && (!q || [o.id, o.name, o.phone].some(x => String(x || "").toLowerCase().includes(q))));
  $("#chips").innerHTML = ["all", ...STATUSES].map(s => { const n = s === "all" ? all.length : all.filter(o => o.status === s).length; return `<button class="chip ${oFilter === s ? "on" : ""}" data-f="${s}">${s === "all" ? "Semua" : s} (${n})</button>`; }).join("");
  $("#ol").innerHTML = list.length ? list.map(o => { const n = nextOf(o); return `<article class="panel ord"><header><h3>${esc(o.id)}</h3><span class="tag ${tone(o.status)}">${esc(o.status)}</span></header>
  <p>${fdate(o.date)} oleh <b>${esc(o.name)}</b>, WhatsApp ${esc(o.phone)}</p>
  <p>${o.items.map(i => `${i.qty}× ${esc(i.name)}`).join(", ")}</p>
  <p>${o.del === "pickup" ? "Ambil sendiri" + (o.slot ? " (" + esc(o.slot) + ")" : "") : esc(o.courier) + " " + esc(o.service || "") + " ke " + esc(o.addr)}${o.note ? `. Catatan: ${esc(o.note)}` : ""}</p>
  <p>Bayar ${esc(o.pay)}${o.pay === CASH ? ` <span class="tag t-w">Tunai – terima ${o.del === "pickup" ? "di toko" : "saat tiba"}</span>` : ""}${o.voucher ? ", voucher " + esc(o.voucher) : ""}. <b style="color:var(--brown)">Total ${rp(o.total)}</b></p>
  <div class="acts">${n ? `<button class="btn pink" data-st="${esc(o.id)}|${n}">${NEED.includes(o.status) ? "Konfirmasi & proses" : "Lanjutkan: " + n}</button>` : ""}
  <select data-sel="${esc(o.id)}" aria-label="Ubah status ${esc(o.id)}">${STATUSES.map(s => `<option ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}</select>
  <a class="btn ghost" target="_blank" rel="noopener" href="${waCust(o)}">Chat pelanggan</a><button class="btn ghost" data-rc="${esc(o.id)}">Struk</button><button class="btn bad" data-del="${esc(o.id)}">Hapus</button></div></article>`; }).join("") : `<div class="empty">${all.length ? "Tidak ada pesanan yang cocok." : "Belum ada pesanan. Pesanan dari halaman pelanggan di browser ini akan muncul di sini."}</div>`;
}
function receipt(id) {
  const o = getOrders().find(x => x.id === id); if (!o) return;
  const r = (a, b, c = "") => `<div class="r ${c}"><span>${a}</span><span>${b}</span></div>`;
  $("#dlg").innerHTML = `<div class="rc"><div class="c">${LOGO}<h2>${STORE.name}</h2><small>${STORE.address}<br>WhatsApp ${STORE.wa}</small></div><hr>
  ${r("No. pesanan", esc(o.id))}${r("Tanggal", fdate(o.date))}${r("Pelanggan", esc(o.name))}${r("Pengambilan", o.del === "pickup" ? "Ambil sendiri" : esc(o.courier) + " " + esc(o.service || ""))}${o.del === "delivery" ? r("Alamat", esc(o.addr)) : ""}<hr>
  ${o.items.map(i => `<div><b>${esc(i.name)}</b>${r(i.qty + " × " + rp(i.price), rp(i.qty * i.price))}</div>`).join("")}<hr>
  ${r("Subtotal", rp(o.sub))}${r("Diskon", "-" + rp(o.disc))}${r("Pengiriman", rp(o.ship))}${r("TOTAL", rp(o.total), "tot")}<hr>${r("Metode bayar", esc(o.pay))}${r("Status", esc(o.status))}
  <div class="c noprint" style="margin-top:1rem;display:flex;gap:.5rem;justify-content:center"><button class="btn" id="prt">Cetak</button><button class="btn ghost" id="cls">Tutup</button></div></div>`;
  $("#dlg").showModal(); $("#prt").onclick = () => window.print(); $("#cls").onclick = () => $("#dlg").close();
}

/* ---- Produk & stok ---- */
function productsView() {
  const st = getStock(), ov = getOv();
  $("#v").innerHTML = `<h1>Produk & stok</h1><p class="sub">Perubahan tersimpan otomatis.</p>
  <div class="note">Stok langsung terbaca halaman pelanggan. Harga dan opsi sembunyikan baru berlaku setelah halaman pelanggan diberi tambahan kode kecil (lihat petunjuk dari Claude).</div>
  <div class="panel">${PRODUCTS.map(p => `<div class="prow"><span class="th" style="background:${COLORS[p.color]}"><img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.remove()"></span>
  <div><b>${esc(p.name)}</b><br><small style="color:var(--soft)">${p.cat}</small></div>
  <label><small>Harga (Rp)</small><br><input type="number" min="0" step="500" value="${price(p)}" data-pr="${p.id}" aria-label="Harga ${esc(p.name)}" style="width:120px"></label>
  <div class="stp"><button data-sk="${p.id}|-1" aria-label="Kurangi stok">−</button><input type="number" min="0" value="${st[p.id]}" data-stk="${p.id}" aria-label="Stok ${esc(p.name)}"><button data-sk="${p.id}|1" aria-label="Tambah stok">+</button></div>
  <label><input type="checkbox" data-vis="${p.id}" ${ov[p.id]?.off ? "" : "checked"}> Tampil</label></div>`).join("")}</div>`;
}
function setStock(id, n) { const st = getStock(); st[id] = Math.max(0, Math.floor(+n) || 0); save("stock", st); const i = $(`[data-stk="${id}"]`); if (i) i.value = st[id]; }

/* ---- Ulasan ---- */
function reviewsView() {
  const rv = load("reviews", {}), rows = [];
  PRODUCTS.forEach(p => (Array.isArray(rv[p.id]) ? rv[p.id] : []).forEach((r, i) => rows.push({ p, r, i })));
  rows.sort((a, b) => String(b.r.date).localeCompare(String(a.r.date)));
  $("#v").innerHTML = `<h1>Ulasan</h1><p class="sub">Hapus ulasan yang tidak pantas.</p>` + (rows.length ? rows.map(({ p, r, i }) => `<article class="panel"><div class="li" style="border:0;padding:0"><b>${esc(p.name)}</b><span style="color:#B07A00;letter-spacing:2px" aria-label="${r.rating} dari 5">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</span></div>
  <p style="margin:.3rem 0">${esc(r.text)}</p><small style="color:var(--soft)">${esc(r.name)}, ${fdate(r.date)}</small><div class="acts"><button class="btn bad" data-rd="${p.id}|${i}">Hapus ulasan</button></div></article>`).join("") : `<div class="empty">Belum ada ulasan dari pelanggan.</div>`);
}

/* ---- Pengaturan ---- */
function settingsView() {
  $("#v").innerHTML = `<h1>Pengaturan</h1><p class="sub">Keamanan dan cadangan data.</p>
  <form class="panel f" id="pf"><h2>Ganti PIN</h2><label for="p1">PIN baru (minimal 4 angka)</label><input type="password" id="p1" inputmode="numeric" autocomplete="off"><div class="err" id="pe"></div><button class="btn pink">Simpan PIN</button>
  <p class="sub" style="margin:.8rem 0 0;font-size:.88rem">PIN hanya mengunci tampilan panel di browser ini. Siapa pun yang bisa membuka browser ini dan alat pengembang tetap bisa membaca datanya, jadi jangan simpan data sensitif di sini.</p></form>
  <div class="panel"><h2>Cadangan data</h2><p class="sub">Data tersimpan di browser dan hilang jika data situs dihapus. Unduh cadangan secara berkala.</p>
  <div class="acts" style="margin:0"><button class="btn" id="bk">Unduh cadangan</button><label class="btn ghost" style="cursor:pointer">Pulihkan dari file<input type="file" id="rs" accept="application/json" hidden></label></div></div>
  <div class="panel"><h2>Hapus semua pesanan</h2><p class="sub">Stok tidak dikembalikan otomatis. Atur ulang stok di menu Produk jika perlu.</p><button class="btn bad" id="wipe">Hapus semua pesanan</button></div>`;
  $("#pf").onsubmit = e => { e.preventDefault(); const v = $("#p1").value; if (!/^\d{4,}$/.test(v)) return $("#pe").textContent = "PIN harus berisi minimal 4 angka."; save("adminPin", v); $("#p1").value = ""; $("#pe").textContent = ""; toast("PIN diganti ✓"); };
  $("#bk").onclick = () => { const o = {}; Object.keys(localStorage).filter(k => k.startsWith(PREF) && k !== PREF + "adminPin").forEach(k => o[k] = localStorage.getItem(k)); dl("cadangan-cloud-bread-puffy-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(o), "application/json"); };
  $("#rs").onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { const o = JSON.parse(t); if (!confirm("Pulihkan data? Pesanan, stok, dan ulasan saat ini akan diganti.")) return; Object.entries(o).forEach(([k, v]) => { if (k.startsWith(PREF) && k !== PREF + "adminPin" && typeof v === "string") localStorage.setItem(k, v); }); toast("Data dipulihkan ✓"); route(); } catch { toast("File cadangan tidak valid."); } }); };
  $("#wipe").onclick = () => { if (confirm("Hapus SEMUA pesanan? Ini tidak bisa dibatalkan.")) { const ids=getOrders().map(o=>String(o.id)); save("orders", []); if(adminCloudReady) Promise.all(ids.map(id=>fbDb.collection("orders").doc(id).delete())).catch(e=>toast("Sebagian pesanan gagal dihapus: "+e.code)); toast("Semua pesanan dihapus."); route(); } };
}

/* ---- Event global ---- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-f],[data-st],[data-rc],[data-del],[data-sk],[data-rd]"); if (!t) return;
  const d = t.dataset;
  if (d.f) { oFilter = d.f; drawOrders(); }
  if (d.st) { const [id, s] = d.st.split("|"); setStatus(id, s); }
  if (d.rc) receipt(d.rc);
  if (d.del && confirm(`Hapus pesanan ${d.del}? Stok tidak dikembalikan otomatis.`)) { const id=d.del; save("orders", getOrders().filter(o => o.id !== id)); if(adminCloudReady) fbDb.collection("orders").doc(String(id)).delete().catch(e=>toast("Gagal menghapus pesanan: "+e.code)); toast("Pesanan dihapus."); route(); }
  if (d.sk) { const [id, n] = d.sk.split("|"); setStock(id, getStock()[id] + +n); }
  if (d.rd && confirm("Hapus ulasan ini?")) { const [id, i] = d.rd.split("|"), rv = load("reviews", {}); rv[id].splice(+i, 1); save("reviews", rv); toast("Ulasan dihapus."); route(); }
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (d.sel) setStatus(d.sel, t.value);
  if (d.stk) setStock(d.stk, t.value);
  if (d.pr) { const ov = getOv(); ov[d.pr] = { ...ov[d.pr], price: Math.max(0, Math.round(+t.value) || 0) }; save("overrides", ov); toast("Harga disimpan ✓"); }
  if (d.vis) { const ov = getOv(); ov[d.vis] = { ...ov[d.vis], off: !t.checked }; save("overrides", ov); toast(t.checked ? "Produk ditampilkan ✓" : "Produk disembunyikan ✓"); }
});
function startAdminCloud() {
  fbDb.collection("appData").doc("stock").get().then(doc=>{ if(!doc.exists) return fbDb.collection("appData").doc("stock").set({values:getStock(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()}); }).catch(e=>console.error("Seed stok:",e));
  if (adminOrdersUnsub) adminOrdersUnsub();
  adminOrdersUnsub = fbDb.collection("orders").onSnapshot(snap => {
    const list=snap.docs.map(d=>d.data()).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    watchOrders(snap);
    localStorage.setItem(PREF+"orders",JSON.stringify(list));
    if (adminCloudReady && !$("#dlg").open) route();
  }, e => { console.error(e); toast("Gagal membaca pesanan Firebase: "+(e.code||e.message)); });
  fbDb.collection("appData").doc("stock").onSnapshot(doc=>{ if(doc.exists && doc.data().values) { localStorage.setItem(PREF+"stock",JSON.stringify(doc.data().values)); if(adminCloudReady && location.hash==="#/products") route(); } }, e=>console.error(e));
}
fbAuth.onAuthStateChanged(user => { if (user && !user.isAnonymous) { adminUser=user; fbDb.collection("admins").doc(user.uid).get().then(d=>{ if(d.exists && d.data().role==="admin") { adminCloudReady=true; startAdminCloud(); route(); } else { adminCloudReady=false; adminUser=null; login(); } }).catch(()=>login()); } else { adminCloudReady=false; adminUser=null; login(); } });
window.addEventListener("storage", e => { if (authed() && e.key === PREF + "orders" && !$("#dlg").open && /^(#\/(dashboard|orders))?$/.test(location.hash)) route(); });
window.addEventListener("hashchange", route);
</script>
</body>
</html>
